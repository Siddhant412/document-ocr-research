# Immutable inputs for the InternVL3.5-8B-Instruct / OmniDocBench baseline.
# Do not edit this file after the reportable smoke inference begins. Create a
# new config for any model, package, preprocessing, prompt, or decoding change.

[dataset]
name = "OmniDocBench"
release = "v1.7"
evaluation_scope = "english_only"
expected_full_evaluation_pages = 755
evaluator_repository = "https://github.com/opendatalab/OmniDocBench.git"
evaluator_commit = "193627ae9e97d89188468ed1ee3b7a856ff76044"
dataset_repository = "https://huggingface.co/datasets/opendatalab/OmniDocBench"
dataset_revision = "aa1ee96d106dbe53d0ae59474d75c6e6d9b53fec"
annotations_sha256 = "a45cd84b04ad8b793e775089640e6b681209abea33ead54c1828ddca35fae496"
images_sha256_manifest = "2e775fddec46dfda75a19cac2e56ba205f0024c2ad000829095bfd6be304f85c"
evaluator_image = "ghcr.io/zeng-weijun/omnidocbench-eval:repro-ubuntu2204"
evaluator_image_digest = "sha256:6116ad72172e763b5c43e963d5efebf2093f2362b975f58156ce4f6c9142e617"

[model]
name = "InternVL3.5-8B-Instruct"
repository = "https://huggingface.co/OpenGVLab/InternVL3_5-8B-Instruct"
huggingface_model = "OpenGVLab/InternVL3_5-8B-Instruct"
# Resolved from the model repository's main ref on 2026-09-12.
huggingface_revision = "61e3b61d08dac94508888b06f5e54d3b44353d28"
architecture = "InternVL custom AutoModel chat interface"
model_format = "official GitHub-format custom-code checkpoint"

[environment]
python = "3.11"
# Use the CUDA 12.8 wheel family for the selected NVIDIA RunPod template.
# It supports the planned H100, RTX 4090, or L4 reproducibility environments.
torch = "2.7.1+cu128"
torchvision = "0.22.1+cu128"
transformers = "4.52.1"
flash_attn = "2.7.4.post1"
einops = "0.8.1"
timm = "1.0.15"
model_cache_root = "/workspace/internvl3.5-8b-instruct-cache"

[inference]
# This is a transparent Markdown task instruction, not a claimed native OCR
# prompt. The runner prepends InternVL's official single-image <image> token.
prompt = "Convert this document page to Markdown. Preserve all text, reading order, headings, lists, tables, and formulas. Represent tables as HTML and formulas as LaTeX. Return only the Markdown, with no commentary."
mode = "normal_instruct"
thinking_system_prompt = false
seed = 20260906
torch_dtype = "bfloat16"
use_flash_attn = true
# Match the model card's official single-image preprocessing example.
image_size = 448
min_num_tiles = 1
max_num_tiles = 12
use_thumbnail = true
# Greedy decoding. temperature=0 is recorded for clarity but is not passed to
# generate because temperature is irrelevant (and invalid in some versions)
# when do_sample=false.
do_sample = false
temperature = 0.0
num_beams = 1
max_new_tokens = 8192

[smoke]
pages = 180
seed = 20260906
minimum_per_source = 5
mechanical_preflight_pages = 3
timing_preflight_pages = 20

[evaluation]
method = "end2end"
match_method = "quick_match"
match_workers = 2
cdm_workers = 2
teds_workers = 2
