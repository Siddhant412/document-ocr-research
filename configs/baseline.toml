# Immutable inputs for the first DeepSeek-OCR / OmniDocBench baseline.
# Do not edit this file after the smoke test has begun. Create a new run config instead.

[dataset]
name = "OmniDocBench"
release = "v1.7"
evaluation_scope = "english_only"
expected_full_evaluation_pages = 755
evaluator_repository = "https://github.com/opendatalab/OmniDocBench.git"
evaluator_commit = "193627ae9e97d89188468ed1ee3b7a856ff76044"
# Fill in after downloading the official v1.7 dataset snapshot.
dataset_repository = "https://huggingface.co/datasets/opendatalab/OmniDocBench"
dataset_revision = "aa1ee96d106dbe53d0ae59474d75c6e6d9b53fec"
annotations_sha256 = "a45cd84b04ad8b793e775089640e6b681209abea33ead54c1828ddca35fae496"
images_sha256_manifest = "2e775fddec46dfda75a19cac2e56ba205f0024c2ad000829095bfd6be304f85c"
evaluator_image = "ghcr.io/zeng-weijun/omnidocbench-eval:repro-ubuntu2204"
evaluator_image_digest = "sha256:6116ad72172e763b5c43e963d5efebf2093f2362b975f58156ce4f6c9142e617"

[model]
name = "DeepSeek-OCR"
repository = "https://github.com/deepseek-ai/DeepSeek-OCR.git"
repository_commit = "09eaf526153e7a01ed16c9dea8c96282aaea29c0"
huggingface_model = "deepseek-ai/DeepSeek-OCR"
huggingface_revision = "9f30c71f441d010e5429c532364a86705536c53a"

[inference]
prompt = "<image>\n<|grounding|>Convert the document to markdown. "
base_size = 1024
image_size = 640
crop_mode = true
save_results = true
test_compress = true
seed = 20260906

[smoke]
pages = 180
seed = 20260906
minimum_per_source = 5

[evaluation]
method = "end2end"
match_method = "quick_match"
match_workers = 2
cdm_workers = 2
teds_workers = 2
