# Immutable inputs for the Qwen2.5-VL-7B-Instruct / OmniDocBench baseline.
# Do not edit this file after Qwen smoke inference begins. Create a new config
# for any prompt, resolution, model-revision, or decoding experiment.

[dataset]
name = "OmniDocBench"
release = "v1.7"
evaluation_scope = "english_only"
expected_full_evaluation_pages = 755
evaluator_repository = "https://github.com/opendatalab/OmniDocBench.git"
evaluator_commit = "193627ae9e97d89188468ed1ee3b7a856ff76044"
dataset_repository = "https://huggingface.co/datasets/opendatalab/OmniDocBench"
dataset_revision = "aa1ee96d106dbe53d0ae59474d75c6e6d9b53fec"
annotations_sha256 = "a45cd84b04ad8b793e775089640e6b681209abea33ead54c1828ddca35fae496"
images_sha256_manifest = "2e775fddec46dfda75a19cac2e56ba205f0024c2ad000829095bfd6be304f85c"
evaluator_image = "ghcr.io/zeng-weijun/omnidocbench-eval:repro-ubuntu2204"
evaluator_image_digest = "sha256:6116ad72172e763b5c43e963d5efebf2093f2362b975f58156ce4f6c9142e617"

[model]
name = "Qwen2.5-VL-7B-Instruct"
repository = "https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct"
huggingface_model = "Qwen/Qwen2.5-VL-7B-Instruct"
# Resolved from the model repository's main ref on 2026-09-08.
huggingface_revision = "cc594898137f460bfe9f0759e9844b3ce807cfb5"
architecture = "Qwen2_5_VLForConditionalGeneration"

[environment]
python = "3.11"
torch = "2.6.0+cu124"
transformers = "4.49.0"
qwen_vl_utils = "0.0.8"
flash_attn = "2.7.3"

[inference]
# Qwen does not publish an OCR-specific Markdown prompt equivalent to DeepSeek's
# native document prompt. This transparent task prompt is therefore part of the
# baseline protocol, not a claimed Qwen-native setting.
prompt = "Convert this document page to Markdown. Preserve all text, reading order, headings, lists, tables, and formulas. Represent tables as HTML and formulas as LaTeX. Return only the Markdown, with no commentary."
seed = 20260906
torch_dtype = "bfloat16"
attn_implementation = "flash_attention_2"
min_pixels = 200704 # 256 * 28 * 28
max_pixels = 1003520 # 1280 * 28 * 28
do_sample = false
num_beams = 1
max_new_tokens = 8192

[smoke]
pages = 180
seed = 20260906
minimum_per_source = 5
mechanical_preflight_pages = 3

[evaluation]
method = "end2end"
match_method = "quick_match"
match_workers = 2
cdm_workers = 2
teds_workers = 2
