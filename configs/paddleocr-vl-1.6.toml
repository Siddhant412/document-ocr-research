# Immutable inputs for the PaddleOCR-VL-1.6 / OmniDocBench baseline.
# Do not edit this file after PaddleOCR-VL smoke inference begins. Create a
# new config for any model, package, model-revision, or inference experiment.

[dataset]
name = "OmniDocBench"
release = "v1.7"
evaluation_scope = "english_only"
expected_full_evaluation_pages = 755
evaluator_repository = "https://github.com/opendatalab/OmniDocBench.git"
evaluator_commit = "193627ae9e97d89188468ed1ee3b7a856ff76044"
dataset_repository = "https://huggingface.co/datasets/opendatalab/OmniDocBench"
dataset_revision = "aa1ee96d106dbe53d0ae59474d75c6e6d9b53fec"
annotations_sha256 = "a45cd84b04ad8b793e775089640e6b681209abea33ead54c1828ddca35fae496"
images_sha256_manifest = "2e775fddec46dfda75a19cac2e56ba205f0024c2ad000829095bfd6be304f85c"
evaluator_image = "ghcr.io/zeng-weijun/omnidocbench-eval:repro-ubuntu2204"
evaluator_image_digest = "sha256:6116ad72172e763b5c43e963d5efebf2093f2362b975f58156ce4f6c9142e617"

[model]
name = "PaddleOCR-VL-1.6"
repository = "https://github.com/PaddlePaddle/PaddleOCR"
# PaddleOCR v3.6.0 tag, peeled to its source commit.
repository_commit = "0006f7874c334ce9c0f497d8b6cce9cdc0b7363d"
pipeline_version = "v1.6"
pipeline_class = "paddleocr.PaddleOCRVL"
inference_engine = "paddle"
vl_model_name = "PaddleOCR-VL-1.6-0.9B"
vl_model_repository = "https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6"
vl_model_revision = "c5630abae1d940eafe0697512a0325494b02ab42"
layout_model_name = "PP-DocLayoutV3"
layout_model_repository = "https://huggingface.co/PaddlePaddle/PP-DocLayoutV3"
layout_model_revision = "7b48a7566925fa464281f930c58eee04fe2c862a"

[environment]
python = "3.11"
paddlepaddle_gpu = "3.2.1"
# CUDA 11.8 wheels are compatible with the prior RunPod RTX 4090's CUDA 12.4
# driver, while the official pipeline only requires CUDA >= 11.8.
paddlepaddle_cuda_wheel = "cu118"
paddleocr = "3.6.0"
paddlex = "3.6.0"
model_source = "huggingface"
model_cache_root = "/workspace/paddleocr-vl-1.6-cache"

[inference]
# Use the official, complete native pipeline: layout analysis followed by
# element-level VLM recognition. The model is never called as a raw HF VLM.
device = "gpu:0"
use_doc_orientation_classify = false
use_doc_unwarping = false
use_layout_detection = true
use_chart_recognition = false
use_seal_recognition = false
use_ocr_for_image_block = false
format_block_content = false
merge_layout_blocks = true
use_queues = true
layout_shape_mode = "auto"
markdown_ignore_labels = ["number", "footnote", "header", "header_image", "footer", "footer_image", "aside_text"]
markdown_pretty = true
markdown_show_formula_number = false
# In PaddleOCR/PaddleX 3.6.0's local native engine, temperature, top_p, and
# repetition_penalty are explicitly unsupported and ignored. It calls native
# generate without sampling controls; this is the reproducible native route.
decoding = "native_local_generate_without_sampling_controls"
max_new_tokens = 8192
seed = 20260906

[smoke]
pages = 180
seed = 20260906
minimum_per_source = 5
mechanical_preflight_pages = 3

[evaluation]
method = "end2end"
match_method = "quick_match"
match_workers = 2
cdm_workers = 2
teds_workers = 2
